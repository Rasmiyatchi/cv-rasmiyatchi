<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sirojiddinov Odiljon — portfolio: loyihalar, tajriba, yutuqlar va ilmiy nashrlar." />
    <meta name="theme-color" content="#2563eb" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f0f1a'/%3E%3Ctext x='50' y='65' font-family='Arial,sans-serif' font-size='36' font-weight='bold' fill='white' text-anchor='middle'%3EO.S%3C/text%3E%3C/svg%3E"
    />
    <title>Odiljon Sirojiddinov — Portfolio</title>
    <script>
      // Dark mode'ni sahifa chizilishidan oldin o'rnatamiz (FOUC oldini olish uchun).
      (function () {
        try {
          // Sukut bo'yicha qorong'i rejim; foydalanuvchi "light" tanlasagina yorug'.
          var stored = localStorage.getItem('theme');
          document.documentElement.classList.toggle('dark', stored !== 'light');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
